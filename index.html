<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/style.css">
    <meta name="author" content="Tomás Mariqueo">
    <title>Certificación-Libroteca</title>
</head>

<body>
    <header class="header">
        <nav class="nav-header">
            <div class="izquierda">
                <div class="titulo">
                    <div class="contenedor-titulo">
                        <h1>Libroteca</span></h1>
                    </div>
                    <div class="contenedor-logo">
                        <img src="static/images/logo.png" alt="logo">
                    </div>
                </div>
            </div>
            <div class="derecha">
                <div class="botones">
                    <div class="boton-inicio">
                        <button id="login">Inicio de sesión</button>
                    </div>
                    <div class="boton-registro">
                        <button id="register">Registro</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="main">
        <div class="registro">
            <div class="registro-caja">
                <img src="static/images/libro.png" alt="icono1">
                <h3>Elige tu libro</h3>
            </div>
            <div class="registro-caja">
                <img src="static/images/check.png" alt="icono2">
                <h3>Revisa disponibilidad</h3>
            </div>
            <div class="registro-caja">
                <img src="static/images/separalo.png" alt="icono3">
                <h3>Sepáralo</h3>
            </div>
            <div class="registro-caja">
                <img src="static/images/shipping.png" alt="icono4">
                <h3>Recíbelo</h3>
            </div>
        </div>
        <div class="links">
            <a id="ficcion" href="#titulo">Ficción</a>
            <a id="historia" href="#titulo">Históricos</a>
            <a id="tecnologia" href="#titulo">Tecnología</a>
            <a id="autoayuda" href="#titulo">Autoayuda</a>
            <a id="poesia" href="#titulo">Poesía</a>
        </div>
        <div class="principal">
            <div class="titulo-principal">
                <h1 id="titulo">Todos los libros</h1>
            </div>
            <div class="seccion-libros">
                <div class="libro">
                    <div class="contenedor-img">
                        <img src="static/images/soledad.jfif"alt="libro">
                    </div>
                    <div class="texto">
                        <p>Cien años de soledad</p>
                        <strong>Gabriel García Márquez</strong>
                    </div>
                    <div class="boton-rentar">
                        <button id="rentar1">Rentar</button>
                    </div>
                </div>

                <div class="libro">
                    <div class="contenedor-img">
                        <img src="static/images/rayuela.jpg"alt="libro">
                    </div>
                    <div class="texto">
                        <p>Rayuela</p>
                        <strong>Julio Cortázar</strong>
                    </div>
                    <div class="boton-rentar">
                        <button id="rentar2">Rentar</button>
                    </div>
                </div>

                <div class="libro">
                    <div class="contenedor-img">
                        <img src="static/images/travesuras.jpg"alt="libro">
                    </div>
                    <div class="texto">
                        <p>Travesuras de la niña mala</p>
                        <strong>Mario Vargas Lloza</strong>
                    </div>
                    <div class="boton-rentar">
                        <button id="rentar3">Rentar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <strong>Todos los derechos reservados. Libroteca</strong>
    </footer>

    <script src="static/js/script.js"></script>
</body>

</html>
